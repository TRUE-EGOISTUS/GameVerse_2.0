<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет разработчика</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .file-list {
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        .file-list p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: #b0b0b0;
        }

        .file-list .error {
            color: #ff4444;
            font-weight: bold;
        }

        .upload-preview {
            max-width: 200px;
            max-height: 200px;
            margin-top: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 65, 108, 0.3);
        }

        .cover-upload {
            position: relative;
            min-height: 200px;
        }

        .upload-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .game-card {
            min-height: 350px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.5rem;
        }

        .game-card h3 {
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-description {
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            font-size: 0.9rem;
        }

        .game-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }

        .game-meta span {
            white-space: nowrap;
        }

        .game-actions {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .game-actions .btn {
            flex: 1;
            min-width: 120px;
            margin: 0;
            padding: 8px 12px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .main-content {
            padding-top: calc(70px + 2rem);
            min-height: calc(100vh - 70px);
        }

        .dashboard-container {
            margin-top: 1rem;
            padding: 0 2rem;
        }

        .upload-section {
            margin-top: 1rem;
        }
        @media (max-width: 768px) {
            .main-content {
                padding-top: calc(100px + 2rem);
            }

            .dashboard-container {
                padding: 0 1rem;
            }

            .game-card {
                min-height: 280px;
            }
            
            .game-actions {
                flex-direction: column;
            }
            
            .game-actions .btn {
                width: 100%;
            }
        }
          /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb-color) !important;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff4b2b;
        }

        /* Firefox scrollbar */
        html {
            scrollbar-color: var(--theme-color);
        }

    </style>
</head>
<body class="gradient-bg dashboard-page">
    <header>
        <div class="header-content">
            <h1 class="neon-text">👨💻 КАБИНЕТ РАЗРАБОТЧИКА</h1>
            <nav class="auth-panel">
                <a href="lichniy_cabinet.html" class="btn neon-btn">← Личный кабинет</a>
                <a href="index.html" class="btn neon-btn">Главная</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="dashboard-container">
            <div class="upload-section glass-card">
                <h2 class="neon-subtitle">🚀 Загрузить новую игру</h2>
                <form id="upload-game-form" enctype="multipart/form-data">
                    <div class="input-group">
                        <label>Название игры</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="input-group">
                        <label>Описание</label>
                        <textarea name="description" rows="3" required></textarea>
                    </div>
                    <div class="input-group">
                        <label>Жанр</label>
                        <select name="genre" required>
                            <option value="Аркада">Аркада</option>
                            <option value="Головоломка">Головоломка</option>
                            <option value="Стратегия">Стратегия</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Теги (через запятую)</label>
                        <input type="text" name="tags" placeholder="кликер, простая, поле">
                    </div>
                    <div class="input-group">
                        <label>Файлы игры (index.html, js, css, картинки и др.)</label>
                        <input type="file" id="gameFiles" name="gameFiles" multiple required style="display:none;">
                        <button type="button" id="addFilesBtn" class="btn neon-btn" style="margin-bottom:10px;">Добавить файлы</button>
                        <div id="fileList" class="file-list"></div>
                    </div>
                    <div class="input-group">
                        <label>Обложка (png/jpg, до 5 МБ)</label>
                        <input type="file" id="cover" name="cover" accept="image/png,image/jpeg">
                        <img id="coverPreview" class="upload-preview" style="display:none;">
                    </div>
                    <button type="submit" class="btn neon-btn">Загрузить игру</button>
                </form>
            </div>

            <div class="my-games-section glass-card">
                <h2 class="neon-subtitle">🎮 Мои игры</h2>
                <div id="myGamesContainer" class="games-grid"></div>
            </div>
        </div>
    </main>

    <div id="editModal" class="modal">
        <div class="modal-content glass-card">
            <span class="close-btn">×</span>
            <h2 class="neon-subtitle">✏️ Редактировать игру</h2>
            <form id="editForm">
                <input type="hidden" id="editGameId">
                
                <div class="input-group">
                    <label>Название игры</label>
                    <input type="text" id="editTitle" required>
                </div>
                
                <div class="input-group">
                    <label>Описание</label>
                    <textarea id="editDescription" rows="4" required></textarea>
                </div>
                
                <div class="input-group">
                    <label>Жанр</label>
                    <select id="editGenre" class="neon-select" required>
                        <option value="Аркада">Аркада</option>
                        <option value="Стратегия">Стратегия</option>
                        <option value="Головоломка">Головоломка</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Теги (через запятую)</label>
                    <input type="text" id="editTags" placeholder="кликер, простая">
                </div>
                
                <button type="submit" class="btn neon-btn">Сохранить</button>
            </form>
        </div>
    </div>
    <script src="/scripts/dashboard.js"></script>
</body>
</html>
