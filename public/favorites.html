<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное - Gaming Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="gradient-bg">
  <header>
    <div class="header-content">
      <h1 class="neon-text">⭐ Избранное</h1>
      <nav class="auth-panel">
        <a href="lichniy_cabinet.html" class="btn neon-btn">← Личный кабинет</a>
        <a href="index.html" class="btn neon-btn">Главная</a>
        <button onclick="logout()" class="btn neon-btn">Выйти</button>
      </nav>
    </div>
  </header>

  <!-- Вынес шаблон сюда, вне контейнера -->
  <template id="game-card-template">
    <div class="game-card">
      <div class="game-cover-wrapper">
        <div class="game-cover-placeholder">
          <span>🎮</span>
          <span class="no-cover-text">Нет обложки</span>
        </div>
        <img class="game-cover" src="" alt="Game cover"
          onerror="this.style.display='none'; this.previousElementSibling.style.display='flex';">
        <div class="game-rating">
          <span class="rating-value"></span>
          <span class="rating-star">★</span>
        </div>
        <button class="action-button info-action" title="Подробнее">
          <span>ℹ️</span>
        </button>
        <button class="action-button favorite-action" title="Убрать из избранного">
          <span>💔</span>
        </button>
      </div>
      <div class="game-info">
        <h3 class="game-title"></h3>
      </div>
    </div>
  </template>

  <main class="main-content">
    <section class="games-section">
      <h2 class="section-title">⭐ Ваши избранные игры</h2>
      <p id="userStatus" class="user-status">Статус: <span>Неизвестно</span></p>
      <div class="games-grid" id="favoritesGrid">
        <!-- Здесь будут рендериться карточки игр -->
      </div>
    </section>
  </main>
  <script src="/scripts/favorites.js"></script>
  <style>
    .gradient-bg {
      background: var(--dark-bg);
    }

    .section-title {
      font-size: 2rem;
      color: #ff416c;
      text-shadow: 0 0 10px var(--theme-color);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .user-status {
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .user-status span {
      color: #ff416c;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 1rem;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
    }

    .game-cover-wrapper {
      position: relative;
      width: 100%;
      height: 150px;
    }

    .game-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-cover-placeholder {
      display: none;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      font-size: 1.2rem;
    }

    .no-games {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.2rem;
      margin: 2rem 0;
    }

    .game-rating {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 10px;
      border-radius: 5px;
      color: #ffeb3b;
    }

    .action-button {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ff416c;
    }

    .info-action {
      bottom: 10px;
      right: 10px;
    }

    .favorite-action {
      top: 10px;
      left: 50px;
    }

    .action-button:hover {
      background: rgba(255, 65, 108, 0.9);
      color: white;
    }

    /* Удалены стили для скроллбара, если были */
    body {
      overflow-y: auto;
    }
  </style>
</body>
</html>
