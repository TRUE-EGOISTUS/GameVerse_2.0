<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVerse</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body class="gradient-bg">
  <canvas id="physics-bg-canvas"></canvas>

  <header>
    <div class="header-content">
      <h1 class="neon-text">
        <span class="logo-icon">🎮</span> GAMEVERSE
      </h1>
      <div id="authPanel" class="auth-panel">
        <div class="auth-dropdown">
          <button class="btn neon-btn dropdown-toggle">🔓 Войти / Рег.</button>
          <div class="dropdown-menu">
            <a href="login.html" class="dropdown-item">🚪 Вход</a>
            <a href="register.html" class="dropdown-item">📝 Регистрация</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div id="banMessage" class="text-center text-danger" style="display: none; margin: 2rem auto; max-width: 600px;">
    </div>

    <section class="filter-section">
      <div class="genre-panel glass-card">
        <h2 class="genre-title">Жанры</h2>
        <div class="genre-buttons">
          <button class="genre-button active" data-genre="">Все игры</button>
          <button class="genre-button" data-genre="Аркада">Аркада</button>
          <button class="genre-button" data-genre="Стратегия">Стратегия</button>
          <button class="genre-button" data-genre="Головоломка">Головоломка</button>
        </div>
      </div>
      <div class="search-panel glass-card">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или описанию...">
      </div>
      <div class="filter-panel glass-card">
        <div class="filter-buttons">
          <button class="filter-button" data-sort="views">👁 По просмотрам</button>
          <button class="filter-button" data-sort="rating">⭐ По оценке</button>
          <button class="filter-button" data-sort="date">📅 По дате</button>
          <button class="filter-button clear-filters" data-sort="">🔄 Сбросить</button>
        </div>
      </div>
    </section>

    <section class="games-section">
      <h2 class="section-title">🔥 Все игры</h2>
      <div class="games-grid" id="gamesGrid">
        <!-- Карточка случайной игры дня будет вставляться первой через JS -->
      </div>

      <!-- Шаблон карточки вынесен вне контейнера -->
      <template id="game-card-template">
        <div class="game-card">
          <div class="game-cover-wrapper">
            <div class="game-cover-placeholder">
              <span>🎮</span>
              <span class="no-cover-text">Нет обложки</span>
            </div>
            <img class="game-cover" src="" alt="Game cover"
              onerror="this.style.display='none'; this.previousElementSibling.style.display='flex';">
            <div class="game-rating">
              <span class="rating-value"></span>
              <span class="rating-star">★</span>
            </div>
            <button class="action-button info-action" title="Подробнее">
              <span>ℹ️</span>
            </button>
            <button class="action-button favorite-action" title="Добавить в избранное">
              <span>❤️</span>
            </button>
          </div>
          <div class="game-info">
            <h3 class="game-title"></h3>
          </div>
        </div>
      </template>

      <!-- Пустой контейнер для динамической отрисовки карточек -->
    </section>
  </main>

  <div id="ratingModal" class="modal">
    <div class="modal-content glass-card">
      <span class="close-btn" onclick="closeRatingModal()">×</span>
      <h2 class="neon-subtitle">Оценить игру</h2>
      <form id="ratingForm" onsubmit="return submitRating(event)">
        <input type="hidden" id="selectedGameId">
        <div class="input-group">
          <label class="neon-label">Ваша оценка (1-5)</label>
          <input type="number" id="gameRating" min="1" max="5" required>
        </div>
        <div class="input-group">
          <label class="neon-label">Комментарий</label>
          <textarea id="gameComment" class="neon-textarea" rows="3"></textarea>
        </div>
        <button type="submit" class="btn neon-btn">Отправить</button>
      </form>
    </div>
  </div>
  <div id="gameOfTheDayModal" class="modal">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <span class="close-button" onclick="closeGameOfTheDayModal()">×</span>
        <h2>🎲 Игра дня</h2>
      </div>
      <div id="gameOfTheDayContent">
        <div class="game-cover-wrapper">
          <img id="gameOfTheDayCover" class="game-cover" src="" alt="Game cover">
          <div id="gameOfTheDayPlaceholder" class="game-cover-placeholder">
            <span>🎮</span>
            <span class="no-cover-text">Нет обложки</span>
          </div>
        </div>
        <h3 id="gameOfTheDayTitle" class="game-title">Название игры</h3>
        <div class="game-rating">
          <span id="gameOfTheDayRating" class="rating-value">0.0</span>
          <span class="rating-star">★</span>
        </div>
        <button id="playGameOfTheDay" class="btn neon-btn">Играть</button>
        <div id="ratingSection" style="display: none; margin-top: 1rem;">
          <h3>Оцените игру</h3>
          <div class="rating-stars" id="ratingStars">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
          </div>
          <textarea id="gameOfTheDayComment" placeholder="Ваш отзыв (необязательно)"
            style="width: 100%; height: 80px; margin-top: 0.5rem;"></textarea>
          <button id="submitGameOfTheDayRating" class="btn neon-btn" style="margin-top: 0.5rem;">Отправить
            отзыв</button>
        </div>
      </div>
    </div>
  </div>


<div id="preloader" class="preloader">
  <div class="joystick-container">
    <svg class="joystick-svg" width="80" height="80" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <!-- Основание джойстика -->
      <rect class="joystick-base" x="12" y="40" width="40" height="12" rx="2" ry="2" />
      <!-- Шток джойстика -->
      <rect class="joystick-stick" x="30" y="24" width="4" height="16" />
      <!-- Ручка -->
      <circle class="joystick-knob" cx="32" cy="16" r="8" />
    </svg>
  </div>

  <p>ЗАГРУЗКА...</p>
  <div class="progress-bar"></div>
</div>




<!-- Обновленный SVG для реалистичной шестерёнки -->
<div id="gameLoader" class="game-loader">
  <div class="gear-loader-container">
    <svg class="gear-loader-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Внешнее кольцо с зубцами -->
      <circle class="gear-outer-ring" cx="50" cy="50" r="42" fill="#333" stroke="#666" stroke-width="1"/>
      
      <!-- Зубцы (12 трапециевидных элементов) -->
      <g class="gear-teeth">
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(0,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(30,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(60,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(90,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(120,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(150,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(180,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(210,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(240,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(270,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(300,50,50)"/>
        <path d="M50,8 L52,15 L58,15 L60,8 L50,8Z" transform="rotate(330,50,50)"/>
      </g>
      
      <!-- Внутренний круг (ступица) -->
      <circle class="gear-inner-hub" cx="50" cy="50" r="20" fill="#333" stroke="#666" stroke-width="1"/>
      
      <!-- Крепежные отверстия -->
      <!-- Крепежные отверстия: равномерно распределены по окружности -->
<g class="gear-holes" fill="#000">
  <!-- 6 отверстий, размещённых на окружности радиуса 18 вокруг центра (50,50) -->
  <circle r="3" cx="50" cy="32" />
  <circle r="3" cx="50" cy="32" transform="rotate(60,50,50)" />
  <circle r="3" cx="50" cy="32" transform="rotate(120,50,50)" />
  <circle r="3" cx="50" cy="32" transform="rotate(180,50,50)" />
  <circle r="3" cx="50" cy="32" transform="rotate(240,50,50)" />
  <circle r="3" cx="50" cy="32" transform="rotate(300,50,50)" />
</g>
    </svg>
  </div>
</div>

  <script src="/scripts/index.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1a1a1a, #3a1c26);
    }

    .gradient-bg {
      background: var(--bg-gradient);
      color: var(--text-color, #ffffff);
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    header {
      background: rgba(0, 0, 0, 0.7);
      border-bottom: 3px solid var(--theme-color);
      box-shadow: 0 0 15px var(--theme-color);
      transition: border-color 0.3s, box-shadow 0.3s;
      width: 100%;
      z-index: 1000;
      position: static;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .neon-text {
      font-size: 2.5rem;
      color: var(--theme-color);
      text-shadow: 0 0 10px var(--theme-color), 0 0 20px var(--theme-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .logo-icon {
      font-size: 2rem;
    }

    .logo-glow {
      width: 20px;
      height: 20px;
      background: var(--theme-color);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--theme-color);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .auth-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn.neon-btn {
      background: var(--theme-color);
      color: var(--text-color, #ffffff);
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      font-family: 'Orbitron', sans-serif;
    }

    .btn.neon-btn:hover {
      background: var(--theme-secondary-color);
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--theme-color);
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--theme-color);
      border-radius: 5px;
      padding: 0.5rem;
      z-index: 1000;
    }

    .auth-dropdown.active .dropdown-menu {
      display: block;
    }

    .dropdown-item {
      display: block;
      padding: 0.5rem 1rem;
      color: var(--text-color, #ffffff);
      text-decoration: none;
      transition: background 0.2s;
    }

    .dropdown-item:hover {
      background: var(--theme-color);
    }

    .genre-button,
    .filter-button {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color, #ffffff);
      border: 1px solid var(--theme-color);
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .genre-button.active,
    .filter-button.active {
      background: var(--theme-color);
      color: var(--text-color, #ffffff);
      transform: scale(1.05);
    }

    .section-title,
    .genre-title {
      color: var(--theme-color);
      text-shadow: 0 0 10px var(--theme-color);
    }

    .game-title {
      color: var(--text-color, #ffffff);
    }

    .modal-content .neon-subtitle,
    .modal-content .neon-label {
      color: var(--theme-color);
      text-shadow: 0 0 5px var(--theme-color);
    }

    .neon-textarea,
    .modal-content input {
      background: rgba(0, 0, 0, 0.5);
      color: var(--text-color, #ffffff);
      border: 1px solid var(--theme-color);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .neon-textarea:focus,
    .modal-content input:focus {
      border-color: var(--theme-color);
      box-shadow: 0 0 5px var(--theme-color);
    }

    @keyframes rgbGlow {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    body.rgb-theme .neon-text,
    body.rgb-theme .btn.neon-btn,
    body.rgb-theme .section-title,
    body.rgb-theme .genre-title,
    body.rgb-theme .modal-content .neon-subtitle,
    body.rgb-theme .modal-content .neon-label,
    body.rgb-theme .logo-glow,
    body.rgb-theme .loading-spinner {
      animation: rgbGlow 5s linear infinite;
    }

    body.rgb-theme .gradient-bg {
      background: linear-gradient(45deg, #ff6666, #66b3ff, #66cc66);
      background-size: 300%;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    body {
      overflow-y: auto var(--theme-color) !important;
    }
  </style>
</body>

</html>
