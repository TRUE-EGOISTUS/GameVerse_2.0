<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет - Gaming Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <!-- Add theme support -->
  <script>
      function applyTheme(theme) {
          document.body.classList.remove('rgb-theme');
          document.body.style.setProperty('--theme-color', getThemeColor(theme));
          document.body.style.setProperty('--theme-secondary-color', getThemeSecondaryColor(theme));
          document.body.style.setProperty('--theme-glow-color', getThemeGlowColor(theme));
          document.body.style.setProperty('--text-color', getTextColor(theme));
          document.body.style.setProperty('--bg-gradient', getBackgroundGradient(theme));
          document.body.style.setProperty('--glass-card-border-color', getThemeGlowColor(theme));
          document.body.style.setProperty('--glass-card-glow', getThemeGlowColor(theme));
          document.body.style.setProperty('--hover-shadow-color', getHoverShadowColor(theme));
          document.body.style.setProperty('--scrollbar-thumb-color', getScrollbarThumbColor(theme));
          document.querySelector('header').style.borderBottomColor = getThemeGlowColor(theme);
          if (theme === 'rgb') {
              document.body.classList.add('rgb-theme');
          }
      }

      function getThemeColor(theme) {
          switch(theme) {
              case 'red': return '#ff416c';
              case 'yellow': return '#ffd700';
              case 'green': return '#4caf50';
              case 'blue': return '#2196f3';
              case 'purple': return '#9c27b0';
              default: return '#ff416c';
          }
      }

      function getThemeSecondaryColor(theme) {
          switch(theme) {
              case 'red': return '#ff4b2b';
              case 'yellow': return '#ffa500';
              case 'green': return '#45a049';
              case 'blue': return '#1e88e5';
              case 'purple': return '#7b1fa2';
              default: return '#ff4b2b';
          }
      }

      function getThemeGlowColor(theme) {
          return getThemeColor(theme);
      }

      function getTextColor(theme) {
          return '#ffffff';
      }

      function getBackgroundGradient(theme) {
          switch(theme) {
              case 'red': return 'linear-gradient(135deg, #1a1a1a, #3a1c26)';
              case 'yellow': return 'linear-gradient(135deg, #1a1a1a, #3a341c)';
              case 'green': return 'linear-gradient(135deg, #1a1a1a, #1c3a1c)';
              case 'blue': return 'linear-gradient(135deg, #1a1a1a, #1c263a)';
              case 'purple': return 'linear-gradient(135deg, #1a1a1a, #2c1c3a)';
              default: return 'linear-gradient(135deg, #1a1a1a, #3a1c26)';
          }
      }

      function getHoverShadowColor(theme) {
          return getThemeGlowColor(theme);
      }

      function getScrollbarThumbColor(theme) {
          return getThemeColor(theme);
      }

      document.addEventListener('DOMContentLoaded', () => {
          const savedTheme = localStorage.getItem('theme') || 'red';
          applyTheme(savedTheme);
      });
  </script>

  <style>
      /* Theme animations */
      @keyframes rgbGlow {
          0% { filter: hue-rotate(0deg); }
          100% { filter: hue-rotate(360deg); }
      }

      /* RGB theme elements */
      body.rgb-theme .neon-text,
      body.rgb-theme .btn.neon-btn,
      body.rgb-theme .section-title {
          animation: rgbGlow 5s linear infinite;
      }

      /* Profile specific styles */
      .profile-avatar-block {
          border: 2px solid var(--theme-color);
          box-shadow: 0 0 15px var(--theme-glow-color);
      }

      .btn {
          background: var(--theme-color);
          border: 1px solid var(--theme-glow-color);
      }

      .btn:hover {
          background: var(--theme-secondary-color);
          box-shadow: 0 0 20px var(--theme-glow-color);
      }

      .gradient-bg {
        background: var(--dark-bg);
      }

      .neon-subtitle {
        font-size: 1.8rem;
        color: #ff416c;
        text-shadow: 0 0 10px var(--theme-color);
        margin-bottom: 1.5rem;
      }

      .profile-section {
        width: 100%;
        max-width: 800px;
        padding: 2rem;
      }

      .profile-info {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
      
        margin-bottom: 1.5rem;
          color: var(--text-color) !important;
      }

      .avatar-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
       color: var(--text-color) !important;;
      }

      .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--theme-color);
        box-shadow: 0 0 15px var(--theme-color);;
      }

      .file-upload-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.6rem 1.2rem;
        background: var(--theme-color);
        border-radius: 8px;
        color: white;
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .file-upload-label:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px var(--theme-color);
        background: var(--theme-secondary-color);
      }

      .user-details {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        font-size: 1.1rem;
            color: var(--text-color) !important;
      }

      .user-details strong {
        color: var(--text-color) !important;
        margin-right: 0.5rem;
      }

      .actions-section {
        width: 100%;
        max-width: 800px;
        padding: 2rem;
      }

      .action-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        justify-items: center;
      }

      .action-buttons .btn {
        width: 100%;
        max-width: 200px;
        padding: 0.8rem;
        font-size: 0.9rem;
        text-align: center;
        border-radius: 8px;
        transition: all 0.3s ease-in-out;
      }

      .admin-btn {
        background: linear-gradient(135deg, #9c27b0, #ff416c);
      }

      .admin-btn:hover {
        box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
      }

      .loading {
        color: #ff416c;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .loading::after {
        content: '';
        width: 16px;
        height: 16px;
        border: 2px solid #ff416c;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 768px) {
        .profile-info {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        .action-buttons {
          grid-template-columns: 1fr;
          gap: 0.8rem;
        }

        .action-buttons .btn {
          max-width: 100%;
        }
      }
    </style>
</head>
<body class="gradient-bg">
  <header>
    <div class="header-content">
      <h1 class="neon-text">🎮 ЛИЧНЫЙ КАБИНЕТ</h1>
      <nav class="auth-panel">
        <a href="index.html" class="btn neon-btn">Главная</a>
        <button onclick="logout()" class="btn neon-btn">Выйти</button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="dashboard-container">
      <div class="profile-section glass-card">
        <h2 class="neon-subtitle">👤 Профиль пользователя</h2>
        <div class="profile-info">
          <div class="avatar-container">
            <img id="userAvatar" src="https://via.placeholder.com/150" alt="Аватар пользователя" class="avatar">
            <label for="avatarUpload" class="file-upload-label">Сменить аватар</label>
            <input type="file" id="avatarUpload" accept="image/png,image/jpeg,image/gif" style="display: none;">
            <div id="avatarLoading" class="loading" style="display: none; margin-top: 0.5rem;">Загрузка...</div>
          </div>
          <div class="user-details">
            <p><strong>Имя пользователя:</strong> <span id="username">User123</span></p>
            <p><strong>Роль:</strong> <span id="userRole">Игрок</span></p>
            <p><strong>Статус:</strong> <span id="userStatus">Онлайн</span></p>
            <p><strong>Последний вход:</strong> <span id="lastLogin">18.04.2025 14:30</span></p>
          </div>
        </div>
      </div>

      <div class="actions-section glass-card">
        <h2 class="neon-subtitle">⚙️ Действия</h2>
        <div class="action-buttons">
          <a href="dashboard.html" id="myGamesBtn" class="btn neon-btn" style="display: none;">Мои игры</a>
          <a href="favorites.html" class="btn neon-btn">Избранное</a>
          <a href="settings.html" class="btn neon-btn">Настройки</a>
          <a href="admin-panel.html" id="adminPanelBtn" class="btn neon-btn admin-btn" style="display: none;">Админ-панель</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/scripts/lichniy_cabinet.js"></script>
</body>
</html>
