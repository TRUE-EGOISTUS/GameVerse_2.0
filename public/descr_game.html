<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Описание игры — GameVerse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--dark-bg);
      overflow-y: auto;
      scrollbar-width: thin;
      /* Для Firefox */
      -ms-overflow-style: scrollbar;
      /* Для Internet Explorer и Edge */
    }

    body::-webkit-scrollbar {
      width: 8px;
      background-color: var(--dark-bg);
    }

    body::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb-color);
      border-radius: 10px;
    }

    body::-webkit-scrollbar-thumb:hover {
      background-color: var(--scrollbar-thumb-hover-color);
    }

    .descr-edit-btn {
      margin-top: 1em;
    }
  </style>
</head>

<body>
  <div class="descr-layout">
    <aside class="descr-left-panel" id="leftPanel">
      <!-- Левая панель: наполняется скриптом -->
    </aside>
    <main class="descr-right-panel">
      <div id="descrMain">
        <!-- Правая панель: наполняется скриптом -->
      </div>
    </main>
  </div>
  <script src="/scripts/descr_game.js"></script>
</body>

</html>
