<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="gradient-bg register-page">
  <div class="content-wrapper">
    <header class="container">
      <div class="header-content">
        <h1 class="neon-text">🚀 РЕГИСТРАЦИЯ</h1>
        <nav class="auth-panel">
          <a href="index.html" class="btn neon-btn">← Назад</a>
        </nav>
      </div>
    </header>

    <main class="main-content container">
      <div class="glass-card mx-auto p-4" style="max-width: 500px;">
        <h2 class="neon-subtitle text-center">📝 Создание аккаунта</h2>
        <div class="input-group">
          <input type="text" id="username" class="neon-input" placeholder="Логин" maxlength="20" required>
        </div>
        <div class="input-group">
          <input type="password" id="password" class="neon-input" placeholder="Пароль" required>
        </div>
        <div class="input-group">
          <select id="role" class="neon-select">
            <option value="user">🎮 Игрок</option>
            <option value="developer">👨💻 Разработчик</option>
            <option value="admin">👑 Администратор</option>
          </select>
        </div>
        <button onclick="register()" class="btn neon-btn w-100">✨ Создать</button>
        <p id="error-message" class="text-danger text-center mt-2" style="display: none;"></p>
      </div>
    </main>
    <footer class="container text-center">
      <p class="neon-text-small">© 2023 GameVerse. Все права защищены.</p>
    </footer>
  </div>
  <script src="/scripts/register.js"></script>
</body>
</html>
